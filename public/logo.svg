<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2AE3B"/>
      <stop offset="50%" stop-color="#D99A32"/>
      <stop offset="100%" stop-color="#B57B1B"/>
    </linearGradient>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7344"/>
      <stop offset="50%" stop-color="#245C36"/>
      <stop offset="100%" stop-color="#1A4428"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8DC760"/>
      <stop offset="100%" stop-color="#72A84A"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF4D0" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#F2AE3B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFF9EC" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#263329" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer Ring with Traditional Decorative Petals -->
  <circle cx="250" cy="250" r="236" fill="#FFFDF7" stroke="#D99A32" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="#245C36" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Saffron Border Band -->
  <circle cx="250" cy="250" r="206" fill="url(#forestGrad)" stroke="#D99A32" stroke-width="3"/>

  <!-- Text Along Path in Devanagari and English -->
  <path id="textCircleTop" d="M 90,250 A 160,160 0 1,1 410,250" fill="none"/>
  <path id="textCircleBottom" d="M 410,250 A 160,160 0 0,1 90,250" fill="none"/>

  <text font-family="'Noto Sans Devanagari', 'Rozha One', serif" font-size="20" font-weight="700" fill="#FFF9EC" letter-spacing="3.5">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      संस्कृति आर्य गुरुकुलम
    </textPath>
  </text>

  <text font-family="'Cinzel', 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#F2AE3B" letter-spacing="4">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      • SANSKRITI ARYA GURUKULAM •
    </textPath>
  </text>

  <!-- Inner Medallion -->
  <circle cx="250" cy="250" r="148" fill="#FFF9EC" stroke="#D99A32" stroke-width="3"/>
  <circle cx="250" cy="250" r="140" fill="url(#sunGlow)"/>

  <!-- Rising Sun Behind Tree -->
  <g transform="translate(250, 240)">
    <!-- Sun Rays -->
    <path d="M0,-85 L0,-115 M32,-78 L48,-102 M60,-60 L85,-85 M78,-32 L102,-48 M85,0 L115,0 M78,32 L102,48 M-32,-78 L-48,-102 M-60,-60 L-85,-85 M-78,-32 L-102,-48 M-85,0 L-115,0" 
          stroke="#D99A32" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Sun Orb -->
    <circle cx="0" cy="-20" r="48" fill="#F2AE3B" opacity="0.85"/>
  </g>

  <!-- Banyan Tree (वटवृक्ष) - Symbolizing Wisdom, Roots & Heritage -->
  <g transform="translate(250, 235)">
    <!-- Tree Trunk & Roots -->
    <path d="M-8,55 C-8,30 -14,10 -22,-5 C-28,-18 -20,-30 0,-30 C20,-30 28,-18 22,-5 C14,10 8,30 8,55 Z" fill="#4B3318"/>
    <!-- Root Branches Spreading into Soil -->
    <path d="M-8,50 Q-25,65 -45,72 M8,50 Q25,65 45,72 M-4,53 Q-12,70 -18,76 M4,53 Q12,70 18,76" stroke="#4B3318" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M-15,15 Q-30,40 -28,65 M15,15 Q30,40 28,65" stroke="#684725" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Lush Foliage Canopy (Layers of Forest and Leaf Greens) -->
    <!-- Base Canopy -->
    <path d="M0,-95 C-45,-95 -75,-70 -75,-40 C-75,-25 -65,-12 -50,-5 C-55,10 -40,25 -25,25 C-10,25 0,15 0,15 C0,15 10,25 25,25 C40,25 55,10 50,-5 C65,-12 75,-25 75,-40 C75,-70 45,-95 0,-95 Z" fill="url(#forestGrad)"/>
    
    <!-- Secondary Leaf Clusters -->
    <circle cx="-38" cy="-55" r="28" fill="url(#leafGrad)" opacity="0.95"/>
    <circle cx="38" cy="-55" r="28" fill="url(#leafGrad)" opacity="0.95"/>
    <circle cx="0" cy="-70" r="32" fill="#72A84A"/>
    <circle cx="-50" cy="-25" r="22" fill="#2E7344"/>
    <circle cx="50" cy="-25" r="22" fill="#2E7344"/>
    <circle cx="0" cy="-35" r="25" fill="#8DC760" opacity="0.9"/>
    
    <!-- Golden Highlights in Canopy -->
    <circle cx="-18" cy="-60" r="8" fill="#F2AE3B" opacity="0.7"/>
    <circle cx="22" cy="-50" r="7" fill="#F2AE3B" opacity="0.7"/>
    <circle cx="0" cy="-80" r="9" fill="#FFF4D0" opacity="0.6"/>

    <!-- Open Book / Vedic Grantha at Base -->
    <g transform="translate(0, 48)">
      <!-- Book Pages -->
      <path d="M-36,6 Q-18,-4 0,4 Q18,-4 36,6 L32,18 Q16,8 0,15 Q-16,8 -32,18 Z" fill="#FFFDF7" stroke="#245C36" stroke-width="1.5"/>
      <path d="M0,4 L0,15" stroke="#245C36" stroke-width="1.5"/>
      <!-- Saffron Bookmark Ribbon -->
      <path d="M0,15 L0,23 L-3,20 L-6,23 L-6,15" fill="#D99A32"/>
    </g>

    <!-- Sacred Diya / Flame on top of grantha -->
    <g transform="translate(0, 32)">
      <!-- Flame -->
      <path d="M0,-8 C4,-5 6,-1 6,2 C6,5.5 3,8 0,8 C-3,8 -6,5.5 -6,2 C-6,-1 -4,-5 0,-8 Z" fill="url(#saffronGrad)"/>
      <circle cx="0" cy="2" r="2.5" fill="#FFF4D0"/>
      <!-- Diya Base -->
      <path d="M-9,8 Q0,13 9,8 Q0,5 -9,8 Z" fill="#D99A32" stroke="#B57B1B" stroke-width="0.8"/>
    </g>
  </g>

  <!-- Bottom Ribbon with Sanskrit Shloka: "सा विद्या या विमुक्तये" -->
  <g transform="translate(250, 410)">
    <!-- Ribbon Banner -->
    <path d="M-130,-12 L-100,-20 L100,-20 L130,-12 L115,10 L100,6 L-100,6 L-115,10 Z" fill="#D99A32" stroke="#B57B1B" stroke-width="1.5" filter="url(#shadow)"/>
    <path d="M-95,-16 L95,-16 L95,2 L-95,2 Z" fill="#FFFDF7"/>
    <text x="0" y="-3" font-family="'Noto Sans Devanagari', 'Rozha One', serif" font-size="13" font-weight="700" fill="#245C36" text-anchor="middle" letter-spacing="1.5">
      सा विद्या या विमुक्तये
    </text>
  </g>
</svg>
